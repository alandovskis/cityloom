[package]
name = "cityloom_editor"
version = "0.1.0"
edition = "2024"

[dependencies]
osm_network = { path = "osm_network" }
any_spawner = { version = "0.3.0", features = ["wasm-bindgen"] }
js-sys = "0.3.106"
leptos = { version = "0.8.21", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["ResizeObserver", "ResizeObserverEntry", "FocusOptions", "DomRect", "PointerEvent", "Element", "HtmlElement", "Window", "KeyboardEvent", "CssStyleDeclaration", "HtmlBodyElement", "Document", "Node", "EventTarget", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ScrollBehavior", "MediaQueryList", "Storage", "NodeList", "HtmlDetailsElement", "WheelEvent", "StorageEvent", "PageTransitionEvent", "HtmlSelectElement", "HtmlOptionElement", "MouseEvent", "FocusEvent", "MediaQueryListEvent", "Event", "Location", "Navigator", "Request", "RequestInit", "RequestMode", "Response", "Headers", "AbortSignal"] }
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }

[workspace]
members = [".", "osm_import", "osm_network"]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
fluent-syntax = "0.12.0"
leptos = { version = "0.8.21", features = ["ssr"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
