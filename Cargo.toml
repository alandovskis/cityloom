[package]
name = "cityloom_editor"
version = "0.1.0"
edition = "2024"

[dependencies]
js-sys = "0.3.106"
leptos = { version = "0.8.21", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
