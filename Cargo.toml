# CityLoom Cargo workspace. Every crate lives under crates/; `cargo build
# --workspace --locked` is the build `team.md` names, and `scripts/verify.sh`
# is the one gate. The licence and repository fields are left to the project
# owner (the repository is public from the first commit, `team.md`).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
publish = false
