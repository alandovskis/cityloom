[package]
name = "osm_import"
version = "0.1.0"
edition = "2024"
description = "OpenStreetMap to a plain street network, through osm2streets. Kept out of the editor's wasm: it is loaded on demand."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
osm2streets = { git = "https://github.com/a-b-street/osm2streets" }
streets_reader = { git = "https://github.com/a-b-street/osm2streets" }
abstutil = { git = "https://github.com/a-b-street/abstreet" }
osm_network = { path = "../osm_network" }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
instant = { version = "0.1.13", features = ["wasm-bindgen"] }

[dev-dependencies]
cityloom_editor = { path = ".." }
