# SonarCloud analysis, run by .github/workflows/sonar.yml (CI-based: Rust has no Automatic Analysis).
sonar.organization=alandovskis
sonar.projectKey=alandovskis_cityloom

sonar.sources=src,osm_import/src,osm_network/src,web,scripts
sonar.tests=e2e/tests,scripts/include/tests
sonar.sourceEncoding=UTF-8

# Vendored libraries, build output, fonts, map data and fixtures are not ours to judge.
sonar.exclusions=web/vendor/**,web/pkg/**,web/data/**,web/fonts/**,web/glyphs/**,**/node_modules/**,target/**,e2e/fixtures/**,scripts/include/tests/**

# Unit tests live beside the code in Rust; these files hold only tests and the wording guard.
sonar.coverage.exclusions=**/tests.rs,src/i18n_guard.rs

# Made by `just sonar-reports`.
sonar.rust.lcov.reportPaths=target/sonar/lcov.info
sonar.rust.clippyReport.reportPaths=target/sonar/clippy.json
