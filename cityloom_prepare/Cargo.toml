[package]
name = "cityloom_prepare"
version = "0.1.0"
edition = "2024"
description = "CityLoom's data preparation: the .cityloom area archive (library) and the prepare command (binary)."

[features]
# The pipeline's binary and the crates only it needs. The server depends on the library with default-features = false.
default = ["cli"]
cli = ["dep:ureq", "dep:clap", "dep:serde_json", "dep:rlimit", "dep:ctrlc"]

[[bin]]
name = "cityloom_prepare"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
tar = { version = "0.4.46", default-features = false }
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = { version = "3.4.2", optional = true }
clap = { version = "4.6.7", optional = true, default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json = { version = "1.0.154", optional = true, features = ["float_roundtrip"] }
rlimit = { version = "0.11.0", optional = true }
ctrlc = { version = "3.5.2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[[test]]
name = "commands"
required-features = ["cli"]

[[test]]
name = "ctrl_c"
required-features = ["cli"]
