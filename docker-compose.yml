services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: cityloom
      POSTGRES_PASSWORD: cityloom
      POSTGRES_DB: cityloom
    ports:
      - "5433:5432"
    volumes:
      - cityloom-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityloom -d cityloom"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  cityloom-pgdata:
