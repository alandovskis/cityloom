[package]
name = "cityloom_editor"
version = "0.63.0"
edition = "2024"

[dependencies]
cityloom_model = { path = "../cityloom_model" }
cityloom_report = { path = "../cityloom_report" }
any_spawner = { version = "0.3.0", features = ["wasm-bindgen"] }
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["ResizeObserver", "ResizeObserverEntry", "FocusOptions", "DomRect", "PointerEvent", "Element", "HtmlElement", "Window", "KeyboardEvent", "CssStyleDeclaration", "HtmlBodyElement", "Document", "Node", "EventTarget", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ScrollBehavior", "MediaQueryList", "Storage", "NodeList", "HtmlDetailsElement", "WheelEvent", "StorageEvent", "PageTransitionEvent", "HtmlSelectElement", "HtmlOptionElement", "MouseEvent", "FocusEvent", "MediaQueryListEvent", "Event", "Location", "Navigator", "Request", "RequestInit", "RequestMode", "Response", "Headers", "History", "AbortSignal", "Crypto", "console", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "File", "FileList"] }
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
fluent-syntax = "0.12.0"
leptos = { version = "0.8.23", features = ["ssr"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# Tests write the report through the PDF writer; a dev-dependency stays out of the editor's own build (`cargo tree -e normal`).
cityloom_report_pdf = { path = "../cityloom_report_pdf" }
lopdf = "0.47.0"
