[package]
name = "cityloom-design-payload"
version = "0.1.0"
description = "The wire/storage shape for a design payload: the one serialised structure that crosses the device/server, Rust/database, and export boundaries (Unit U3)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.151"
