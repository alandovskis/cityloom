[package]
name = "cityloom-design-storage"
version = "0.1.0"
description = "Stored designs: anonymous uploads and, from Stage 2, account-owned designs — retention, object-level authorisation and identifier rate limiting (Unit U10, DesignRepository)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
cityloom-api-types = { path = "../cityloom-api-types" }
cityloom-design-payload = { path = "../cityloom-design-payload" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["catch-panic"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "fmt", "std"] }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
