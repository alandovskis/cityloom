[package]
name = "citymodel_builder"
version = "0.1.0"
edition = "2024"
description = "CityLoom's data preparation: the .citymodel area archive (library) and the prepare command (binary)."

[features]
# The pipeline's binary and the crates only it needs. The server depends on the library with default-features = false.
default = ["cli"]
cli = ["import", "dep:ureq", "dep:clap", "dep:serde_json", "dep:ctrlc"]
# The importer, which makes the network tiles: osm2streets and its git dependencies.
import = ["dep:osm_import", "dep:cityloom_model"]

[[bin]]
name = "citymodel_builder"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
tar = { version = "0.4.46", default-features = false }
sha2 = "0.11.1"
thiserror = "2.0.21"
# No gzip: Range and Content-Length must mean bytes on disk.
ureq = { version = "3.5.1", optional = true, default-features = false, features = ["rustls"] }
clap = { version = "4.6.7", optional = true, default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json = { version = "1.0.154", optional = true, features = ["float_roundtrip"] }
ctrlc = { version = "3.5.2", optional = true }
osm_import = { path = "../osm_import", optional = true }
cityloom_model = { path = "../cityloom_model", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[[test]]
name = "commands"
required-features = ["cli"]

[[test]]
name = "download"
required-features = ["cli"]

[[test]]
name = "ctrl_c"
required-features = ["cli"]

[[test]]
name = "tiles"
required-features = ["cli"]

[[test]]
name = "prepare"
required-features = ["cli"]

[[test]]
name = "progress"
required-features = ["cli"]
