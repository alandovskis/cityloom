[package]
name = "osm-extract-proxy"
version = "0.1.0"
description = "Serves OpenStreetMap extract clips for a bounding box from regional data built offline (Unit U9)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "osm-extract-proxy"
path = "src/bin/osm-extract-proxy.rs"

[[bin]]
name = "region-build"
path = "src/bin/region-build.rs"

[dependencies]
cityloom-api-types = { path = "../cityloom-api-types" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["set-header", "catch-panic"] }
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["server", "server-auto", "server-graceful", "tokio", "http1"] }
http = "=1.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
osmpbf = "=0.3.8"
protobuf = "=3.7.2"
flate2 = "=1.1.10"
moka = { version = "=0.12.16", features = ["future"] }
blake3 = "=1.8.7"
md-5 = "=0.11.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "fmt", "std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
thiserror = "=2.0.20"
toml = "=1.1.6"
tempfile = "=3.27.0"

[build-dependencies]
protobuf-codegen = "=3.7.2"

[dev-dependencies]
http-body-util = "=0.1.5"
futures = "=0.3.34"
