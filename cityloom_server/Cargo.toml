[package]
name = "cityloom_server"
version = "0.1.0"
edition = "2024"
description = "CityLoom's server: serves web/ and, later, the accounts."

[features]
# An OpenID provider for tests, served by the server itself. Never in a release build.
test-provider = []

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
tower-http = { version = "0.7.1", features = ["fs"] }
percent-encoding = "2.3.2"
thiserror = "2.0.21"
base64 = "0.23.1"
url = "2.5.8"
zeroize = { version = "1.9.1", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
hmac = { version = "0.13.0", features = ["zeroize"] }
sha2 = "0.11.1"
hex = "0.4.3"
subtle = "2.6.1"
getrandom = "0.4.3"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
