[package]
name = "cityloom_report"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pdf"]
pdf = ["dep:krilla", "dep:wasm-bindgen", "dep:serde_json", "dep:ttf-parser"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
ttf-parser = { version = "0.25.1", optional = true }
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"], optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }

[dev-dependencies]
lopdf = "0.47.0"
