# What the reporter picked on an issue form becomes a label (.github/workflows/issue-labeler.yml). Each rule reads
# one dropdown's answer: the `### <field label>` heading GitHub writes into the issue body, a blank line, then
# exactly the option's text on a line of its own. The same words typed anywhere else in the issue do not match, and
# the text is never read for hints. The field labels and options are the forms' in .github/ISSUE_TEMPLATE
# (scripts/include/tests/test_issue_system.py builds the body for each and fails when a rule disagrees).
# The action reads `/regex/` as a regular expression; keys are label names; "Not sure" and "Other" have no rule.
"A-places · lieux":
  - '/(?:^|\n)### Which page were you on\? \/ Sur quelle page étiez-vous\?\r?\n\r?\nHome \(finding a place\) \/ Accueil \(chercher un lieu\)(?:\r?\n|$)/'
