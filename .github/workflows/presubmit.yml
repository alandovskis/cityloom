name: Presubmit

# What a pull request must pass before it is merged. postsubmit.yml checks main in full once it is merged, and deploys it.
#
# A change to documentation alone (the `docs` rule of scripts/ci/spec-map.json) does not start this workflow: it changes
# nothing the site serves, and .github/workflows/docs.yml builds, checks and publishes the documentation. No check is
# required on main, so a path filter is safe. scripts/include/tests/test_ci_changes.py fails when the list and that rule
# differ.
on:
  pull_request:
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: presubmit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The build and test jobs run in the toolchain images of dockerfiles/, pulled from GHCR (images.yml).
  packages: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # Debug info is most of what the linker does for the test binaries, and no CI log shows it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  JUST_VERSION: 1.59.0

# Actions are pinned to a commit; Dependabot proposes the updates.
jobs:
  # What the change touches decides what runs (scripts/ci/ci_changes.py, rules in scripts/ci/spec-map.json): a pull
  # request runs the Rust tests of the crates it touches and of their dependents (rust_args) and only the browser specs its files can affect, in the tiers that own them
  # (tests/e2e/tiers.json: UI and integration; the E2E tier runs only in postsubmit.yml, on every spec of main).
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.select.outputs.unit }}
      rust: ${{ steps.select.outputs.rust }}
      rust_args: ${{ steps.select.outputs.rust_args }}
      wasm: ${{ steps.select.outputs.wasm }}
      wasm_args: ${{ steps.select.outputs.wasm_args }}
      server_release: ${{ steps.select.outputs.server_release }}
      version: ${{ steps.select.outputs.version }}
      browser: ${{ steps.select.outputs.browser }}
      ui: ${{ steps.select.outputs.ui }}
      ui_specs: ${{ steps.select.outputs.ui_specs }}
      integration: ${{ steps.select.outputs.integration }}
      integration_specs: ${{ steps.select.outputs.integration_specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/ci_changes.py --event pull_request --base "$BASE"

  # The toolchain images the build and test jobs run in: their tag, and a build and push only when GHCR lacks them.
  images:
    name: Toolchain images
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write

  # rustfmt and Prettier together: the e2e image is the one with Rust and Node.
  format:
    name: Format
    needs: images
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.images.outputs.registry }}cityloom-e2e:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
        working-directory: tests/e2e
      - run: just format-check

  # The issue system's labels, forms and labeler rules, and the CI selector's own tests (standard library only, no setup).
  scripts:
    name: Script tests
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      # The base the limit on unmapped tests may not be raised from (test_features.py).
      - env:
          FEATURES_BASE: ${{ github.event.pull_request.base.sha }}
        run: just test-scripts

  # The crates the change touches and the crates that depend on them (`rust_args`; every crate when something they all read
  # changed, such as web/ or Cargo.lock).
  test:
    name: Unit tests
    needs: [changes, images]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.images.outputs.registry }}cityloom-rust:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # From inside the container the service is reached by its name.
    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cityloom
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityloom
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust cache below keeps <workspace>/target, not the image's CARGO_TARGET_DIR (/target): build there instead.
      - run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just test-host $CRATES
        env:
          CRATES: ${{ needs.changes.outputs.rust_args }}

  # A type-check of the code only the wasm32 target compiles, beside the host tests (`just test` runs both in turn).
  wasm:
    name: Wasm type-check
    needs: [changes, images]
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.images.outputs.registry }}cityloom-rust:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust cache below keeps <workspace>/target, not the image's CARGO_TARGET_DIR (/target): build there instead.
      - run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just test-wasm $CRATES
        env:
          CRATES: ${{ needs.changes.outputs.wasm_args }}

  server-release:
    name: Release server has no fake provider
    needs: [changes, images]
    if: needs.changes.outputs.server_release == 'true'
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.images.outputs.registry }}cityloom-rust:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust cache below keeps <workspace>/target, not the image's CARGO_TARGET_DIR (/target): build there instead.
      - run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just check-no-fake
      # A positive control: the check must fail on a build with the fake provider, or its markers have drifted. The image
      # builds into its own CARGO_TARGET_DIR, so target-dir.sh says where the binary is.
      - run: |
          cargo build --release -p cityloom_server --features test-provider
          dir=$(./scripts/target-dir.sh)
          if ./scripts/check-no-fake.sh "$dir/release/cityloom_server"; then
            echo "check-no-fake.sh passed a build with the fake provider" >&2
            exit 1
          fi

  # The wasm and the test-provider server are built once and handed to the three browser tiers, so splitting them does
  # not triple the build.
  build:
    name: Build for the browser tests
    needs: [changes, images]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-26.04
    # Rust and Node: `just build` compresses what it built (scripts/precompress.mjs).
    container:
      image: ${{ needs.images.outputs.registry }}cityloom-e2e:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust cache below keeps <workspace>/target, not the image's CARGO_TARGET_DIR (/target): build there instead.
      - run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # wasm-bindgen-cli, at the version the editor pins, is in the image.
      - run: npm ci
      - run: just build
      # The server the tiers start, copied to target/e2e (scripts/pin-server.sh).
      - run: just server
      # The OSM fixtures as network tiles (tests/e2e/fixtures/generated), which every tier serves or packs: made here, where
      # Rust and its cache already are, so the UI and integration jobs need no toolchain.
      - run: just e2e-fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-build
          path: |
            web/pkg
            web/vendor
            target/e2e/cityloom_server
            tests/e2e/fixtures/generated
          if-no-files-found: error
          retention-days: 1

  # UI tier (tests/e2e/tiers.json): one page, the network stubbed, the static server only. No database, no archive.
  ui:
    name: UI tests
    needs: [changes, images, build]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.images.outputs.registry }}cityloom-e2e:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/browser-tests
      # The specs the change's files can affect (`ui_specs`, empty for every one of the tier).
      - run: npx playwright test --project=ui $SPECS
        working-directory: tests/e2e
        env:
          SPECS: ${{ needs.changes.outputs.ui_specs }}
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-ui
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Integration tier: the real server and a Postgres (sign-in, the account, the sync).
  integration:
    name: Integration tests
    needs: [changes, images, build]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.images.outputs.registry }}cityloom-e2e:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # From inside the container the service is reached by its name.
    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cityloom
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityloom
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/browser-tests
      - run: npx playwright test --project=integration $SPECS
        working-directory: tests/e2e
        env:
          SPECS: ${{ needs.changes.outputs.integration_specs }}
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-integration
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # No E2E tier here: it packs and unpacks an archive and reads the real server's headers, which only main needs to prove
  # (postsubmit.yml runs it, in full, before the deploy).

  # Every pull request raises the version in crates/cityloom_editor/Cargo.toml (semantic versioning); the pages show it in the menu. A change
  # made only of documentation and CI configuration (CI_CONFIGURATION in scripts/ci/ci_changes.py) does not need one: it
  # changes nothing the pages show.
  version:
    name: Version bump
    needs: changes
    if: needs.changes.outputs.version == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-version.sh "origin/$BASE_REF"

  # One check to require in branch protection, whatever jobs are added later.
  ci:
    name: CI
    if: always()
    needs: [changes, images, format, scripts, test, wasm, build, ui, integration, server-release, version]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # A job `changes` decided not to run is skipped, which passes; `changes` itself failing fails here.
      - name: No job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
