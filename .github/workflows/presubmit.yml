name: Presubmit

# What a pull request must pass before it is merged. postsubmit.yml checks main in full once it is merged, and deploys it.
#
# A change to documentation alone (the `docs` rule of scripts/ci/spec-map.json) does not start this workflow: it changes
# nothing the site serves, and .github/workflows/docs.yml builds, checks and publishes the documentation. No check is
# required on main, so a path filter is safe. scripts/include/tests/test_ci_changes.py fails when the list and that rule
# differ.
on:
  pull_request:
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: presubmit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # Debug info is most of what the linker does for the test binaries, and no CI log shows it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  JUST_VERSION: 1.59.0

# Actions are pinned to a commit; Dependabot proposes the updates.
jobs:
  # What the change touches decides what runs (scripts/ci/ci_changes.py, rules in scripts/ci/spec-map.json): a pull
  # request runs every unit test but only the browser specs its files can affect, in the tiers that own them
  # (e2e/tiers.json); anything doubtful runs every spec. postsubmit.yml runs every spec on main.
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.select.outputs.unit }}
      version: ${{ steps.select.outputs.version }}
      browser: ${{ steps.select.outputs.browser }}
      ui: ${{ steps.select.outputs.ui }}
      ui_specs: ${{ steps.select.outputs.ui_specs }}
      integration: ${{ steps.select.outputs.integration }}
      integration_specs: ${{ steps.select.outputs.integration_specs }}
      e2e: ${{ steps.select.outputs.e2e }}
      e2e_specs: ${{ steps.select.outputs.e2e_specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/ci_changes.py --event pull_request --base "$BASE"

  format:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: npm ci
        working-directory: e2e
      - run: just format-check

  test:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cityloom
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: just test-host
      # The issue system's labels, forms and labeler rules (standard library only, no setup).
      - run: just test-scripts

  # A type-check of the code only the wasm32 target compiles, beside the host tests (`just test` runs both in turn).
  wasm:
    name: Wasm type-check
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: just test-wasm

  server-release:
    name: Release server has no fake provider
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: just check-no-fake
      # A positive control: the check must fail on a build with the fake provider, or its markers have drifted.
      - run: |
          cargo build --release -p cityloom_server --features test-provider
          if ./scripts/check-no-fake.sh target/release/cityloom_server; then
            echo "check-no-fake.sh passed a build with the fake provider" >&2
            exit 1
          fi

  # The wasm and the test-provider server are built once and handed to the three browser tiers, so splitting them does
  # not triple the build.
  build:
    name: Build for the browser tests
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      # wasm-bindgen-cli takes minutes to compile, so keep it for as long as its version holds.
      - id: wasm-bindgen
        run: echo "version=$(just --evaluate wasm_bindgen)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wasm-bindgen.outputs.version }}
      - run: npm ci
      - run: cargo install wasm-bindgen-cli --version ${{ steps.wasm-bindgen.outputs.version }} --root .tools
      - run: just build
      # The server the tiers start, copied to target/e2e (scripts/pin-server.sh).
      - run: just server
      # The OSM fixtures as network tiles (e2e/fixtures/generated), which every tier serves or packs: made here, where
      # Rust and its cache already are, so the UI and integration jobs need no toolchain.
      - run: just e2e-fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-build
          path: |
            web/pkg
            web/vendor
            target/e2e/cityloom_server
            e2e/fixtures/generated
          if-no-files-found: error
          retention-days: 1

  # UI tier (e2e/tiers.json): one page, the network stubbed, the static server only. No database, no archive.
  # It is the longest job, so it is split over runners: Playwright gives each shard a share of the tests (fullyParallel),
  # and a pull request that picks few specs can leave a shard with none, which must not fail it.
  ui:
    name: UI tests (${{ matrix.shard }}/6)
    needs: [changes, build]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/browser-tests
      # The specs the change's files can affect (`ui_specs`, empty for every one of the tier).
      - run: npx playwright test --project=ui --shard=${{ matrix.shard }}/6 --pass-with-no-tests $SPECS
        working-directory: e2e
        env:
          SPECS: ${{ needs.changes.outputs.ui_specs }}
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-ui-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Integration tier: the real server and a Postgres (sign-in, the account, the sync).
  integration:
    name: Integration tests
    needs: [changes, build]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cityloom
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/browser-tests
      - run: npx playwright test --project=integration $SPECS
        working-directory: e2e
        env:
          SPECS: ${{ needs.changes.outputs.integration_specs }}
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-integration
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # E2E tier: the whole path from data to page. The archive is packed from the fixtures (citymodel_builder, so this job has
  # Rust, and no database) and unpacked by a fresh server; the delivery specs read the real server's headers and ranges.
  e2e:
    name: E2E tests
    needs: [changes, build]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/browser-tests
      # `e2e_specs` narrows the tier on a pull request (the archive spec brings the map and street specs it repeats).
      - run: scripts/e2e-archive.sh $SPECS
        env:
          SPECS: ${{ needs.changes.outputs.e2e_specs }}
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-e2e
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Every pull request raises the version in crates/cityloom_editor/Cargo.toml (semantic versioning); the pages show it in the menu. A change
  # made only of documentation and CI configuration (CI_CONFIGURATION in scripts/ci/ci_changes.py) does not need one: it
  # changes nothing the pages show.
  version:
    name: Version bump
    needs: changes
    if: needs.changes.outputs.version == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-version.sh "origin/$BASE_REF"

  # One check to require in branch protection, whatever jobs are added later.
  ci:
    name: CI
    if: always()
    needs: [changes, format, test, wasm, build, ui, integration, e2e, server-release, version]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # A job `changes` decided not to run is skipped, which passes; `changes` itself failing fails here.
      - name: No job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
