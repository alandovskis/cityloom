name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request supersedes the run in progress; runs on main always finish.
concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Not part of the `CI` aggregate job in ci.yml: the analysis reports and never blocks a merge or the deploy.
# It has no -D warnings (Clippy's findings are Sonar's to judge), which is why it is not a job of ci.yml.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  JUST_VERSION: 1.58.0

# Actions are pinned to a commit; Dependabot proposes the updates.
jobs:
  sonar:
    name: SonarCloud analysis
    # A pull request from a fork gets no secrets, so it cannot be analysed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      # The whole history, so Sonar can tell what is new code and blame it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov
      - run: just sonar-reports
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
