# The weekly regional-data build (BR8.5, `infrastructure-specification.md`
# CP-4): runs `region-build`, publishes a GitHub Release named after the
# content-derived buildId only when it changed, and commits the pointer
# file the Dockerfile's data stage reads. Never touches application code.

name: Weekly data build

on:
  schedule:
    # Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: data-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Run region-build
        run: |
          cargo run --release --locked --bin region-build -- \
            --config data/regions.toml --out target/data | tee /tmp/region-build.out

      - name: Read the produced buildId
        id: produced
        run: |
          build_id=$(sed -n 's/^buildId=//p' /tmp/region-build.out)
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"

      - name: Compare against the current pointer
        id: pointer
        run: |
          current=$(sed -n 's/^build_id = "\(.*\)"$/\1/p' data/current-build.toml)
          echo "current=${current}" >> "$GITHUB_OUTPUT"

      - name: Stop here if the buildId is unchanged
        if: steps.produced.outputs.build_id == steps.pointer.outputs.current
        run: |
          echo "buildId unchanged (${{ steps.produced.outputs.build_id }}); nothing to publish."
          exit 0

      - name: Compute asset checksums
        if: steps.produced.outputs.build_id != steps.pointer.outputs.current
        id: sha
        run: |
          store_sha256=$(sha256sum target/data/store.bin | cut -d' ' -f1)
          manifest_sha256=$(sha256sum target/data/manifest.json | cut -d' ' -f1)
          echo "store_sha256=${store_sha256}" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=${manifest_sha256}" >> "$GITHUB_OUTPUT"

      - name: Delete any incomplete release at this tag
        if: steps.produced.outputs.build_id != steps.pointer.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-${{ steps.produced.outputs.build_id }}"
          gh release delete "$tag" --yes --cleanup-tag || true

      - name: Publish the release
        if: steps.produced.outputs.build_id != steps.pointer.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-${{ steps.produced.outputs.build_id }}"
          gh release create "$tag" \
            target/data/store.bin target/data/manifest.json \
            --title "$tag" \
            --notes "store.bin sha256: ${{ steps.sha.outputs.store_sha256 }}
          manifest.json sha256: ${{ steps.sha.outputs.manifest_sha256 }}"

      - name: Download the published assets back and verify
        if: steps.produced.outputs.build_id != steps.pointer.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-${{ steps.produced.outputs.build_id }}"
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          gh release download "$tag" --dir /tmp/verify
          echo "${{ steps.sha.outputs.store_sha256 }}  /tmp/verify/store.bin" | sha256sum -c -
          echo "${{ steps.sha.outputs.manifest_sha256 }}  /tmp/verify/manifest.json" | sha256sum -c -

      - name: Commit the pointer
        if: steps.produced.outputs.build_id != steps.pointer.outputs.current
        run: |
          tag="data-${{ steps.produced.outputs.build_id }}"
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > data/current-build.toml <<EOF
          # See the comment history in git log for the placeholder this
          # replaced; this file is written only by this workflow.
          release_tag = "${tag}"
          build_id = "${{ steps.produced.outputs.build_id }}"
          store_sha256 = "${{ steps.sha.outputs.store_sha256 }}"
          manifest_sha256 = "${{ steps.sha.outputs.manifest_sha256 }}"
          published_at = "${published_at}"
          EOF
          git config user.name "cityloom-data-build[bot]"
          git config user.email "actions@github.com"
          git add data/current-build.toml
          git commit -m "data: publish ${tag}"
          git push
