name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request supersedes the run in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  JUST_VERSION: 1.59.0

# Actions are pinned to a commit; Dependabot proposes the updates.
jobs:
  # What the change touches decides what runs (scripts/ci/ci_changes.py, rules in scripts/ci/spec-map.json): a change to
  # documentation alone skips the Rust, browser and Railway jobs; a pull request runs every unit test but only the
  # browser specs its files can affect, in the tiers that own them (e2e/tiers.json). A push to main and a manual run always
  # run every spec; anything doubtful does too.
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.select.outputs.docs_only }}
      unit: ${{ steps.select.outputs.unit }}
      browser: ${{ steps.select.outputs.browser }}
      ui: ${{ steps.select.outputs.ui }}
      ui_specs: ${{ steps.select.outputs.ui_specs }}
      integration: ${{ steps.select.outputs.integration }}
      integration_specs: ${{ steps.select.outputs.integration_specs }}
      e2e: ${{ steps.select.outputs.e2e }}
      e2e_specs: ${{ steps.select.outputs.e2e_specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci/ci_changes.py --event "$EVENT" --base "$BASE"

  format:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: npm ci
        working-directory: e2e
      - run: just format-check

  test:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cityloom
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      # Host tests, and a type-check of the code only the wasm32 target compiles.
      - run: just test
      # The issue system's labels, forms and labeler rules (standard library only, no setup).
      - run: just test-scripts

  server-release:
    name: Release server has no fake provider
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: just check-no-fake
      # A positive control: the check must fail on a build with the fake provider, or its markers have drifted.
      - run: |
          cargo build --release -p cityloom_server --features test-provider
          if ./scripts/check-no-fake.sh target/release/cityloom_server; then
            echo "check-no-fake.sh passed a build with the fake provider" >&2
            exit 1
          fi

  # The wasm and the test-provider server are built once and handed to the three browser tiers, so splitting them does
  # not triple the build.
  build:
    name: Build for the browser tests
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      # wasm-bindgen-cli takes minutes to compile, so keep it for as long as its version holds.
      - id: wasm-bindgen
        run: echo "version=$(just --evaluate wasm_bindgen)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wasm-bindgen.outputs.version }}
      - run: npm ci
      - run: cargo install wasm-bindgen-cli --version ${{ steps.wasm-bindgen.outputs.version }} --root .tools
      - run: just build
      # The server the tiers start, copied to target/e2e (scripts/pin-server.sh).
      - run: just server
      # The OSM fixtures as network tiles (e2e/fixtures/generated), which every tier serves or packs: made here, where
      # Rust and its cache already are, so the UI and integration jobs need no toolchain.
      - run: just e2e-fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-build
          path: |
            web/pkg
            web/vendor
            target/e2e/cityloom_server
            e2e/fixtures/generated
          if-no-files-found: error
          retention-days: 1

  # UI tier (e2e/tiers.json): one page, the network stubbed, the static server only. No database, no archive.
  ui:
    name: UI tests
    needs: [changes, build]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/browser-tests
      # A pull request runs the specs its files can affect (`ui_specs`, empty for every one); main runs them all.
      - run: npx playwright test --project=ui $SPECS
        working-directory: e2e
        env:
          SPECS: ${{ needs.changes.outputs.ui_specs }}
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-ui
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Integration tier: the real server and a Postgres (sign-in, the account, the sync).
  integration:
    name: Integration tests
    needs: [changes, build]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cityloom
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/browser-tests
      - run: npx playwright test --project=integration $SPECS
        working-directory: e2e
        env:
          SPECS: ${{ needs.changes.outputs.integration_specs }}
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-integration
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # E2E tier: the whole path from data to page. The archive is packed from the fixtures (citymodel_builder, so this job has
  # Rust, and no database) and unpacked by a fresh server; the delivery specs read the real server's headers and ranges.
  e2e:
    name: E2E tests
    needs: [changes, build]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/browser-tests
      # `e2e_specs` narrows the tier on a pull request (the archive spec brings the map and street specs it repeats).
      - run: scripts/e2e-archive.sh $SPECS
        env:
          SPECS: ${{ needs.changes.outputs.e2e_specs }}
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-e2e
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The documentation site (website/) builds in both languages; a broken link fails the build.
  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: npm ci
        working-directory: website
      - run: just docs-build
      # What `docs-deploy` publishes; uploaded on every run, so a pull request shows the site would build.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  # Every pull request raises the version in crates/cityloom_editor/Cargo.toml (semantic versioning); the pages show it in the menu. A change
  # to documentation alone does not need one: it changes nothing the pages show.
  version:
    name: Version bump
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-version.sh "origin/$BASE_REF"

  # One check to require in branch protection, whatever jobs are added later.
  ci:
    name: CI
    if: always()
    needs: [changes, format, test, build, ui, integration, e2e, docs, server-release, version]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # A job `changes` decided not to run is skipped, which passes; `changes` itself failing fails here.
      - name: No job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac

  # Only a green main goes live. Needs the RAILWAY_TOKEN secret (a project token for the cityloom project's
  # production environment) in the `production` environment.
  deploy:
    name: Deploy to Railway
    # Documentation alone changes nothing the site serves.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.docs_only != 'true'
    needs: [ci, changes]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: production
    # Deploys run one at a time, in order, and are never cancelled half way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RAILWAY_CLI_VERSION: 5.71.0
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      # wasm-bindgen-cli and cargo-zigbuild take minutes to compile, so keep them (in a cache of their own, apart from the
      # browser tests') for as long as the wasm-bindgen version and the suffix below hold; the Railway CLI is pinned.
      - id: wasm-bindgen
        run: echo "version=$(just --evaluate wasm_bindgen)" >> "$GITHUB_OUTPUT"
      - id: deploy-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: deploy-tools-${{ runner.os }}-${{ steps.wasm-bindgen.outputs.version }}-zigbuild-1
      - if: steps.deploy-tools.outputs.cache-hit != 'true'
        run: |
          cargo install wasm-bindgen-cli --version ${{ steps.wasm-bindgen.outputs.version }} --root .tools
          cargo install cargo-zigbuild --locked --root .tools
      - run: npm ci

      # The tiles are made from Geofabrik's Quebec extract (1.2 GB) and take a long time, so keep them until the
      # code that makes them change. Run the workflow again after clearing the cache to take a newer extract.
      # The key hashes only the sources that decide the tiles: citymodel_builder's tiles, metro_index and network_tiles
      # modules, and the importer that makes the network they are cut from (osm_import, and cityloom_model, which holds
      # the network's shape and IMPORTER_VERSION). A change to any of them makes the tiles again; a change to the
      # progress display, the archive or a dependency does not.
      - id: tiles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/data/metro
          key: tiles-${{ hashFiles('crates/citymodel_builder/src/tiles.rs', 'crates/citymodel_builder/src/metro_index.rs', 'crates/citymodel_builder/src/network_tiles.rs', 'crates/osm_import/src/**', 'crates/cityloom_model/src/**') }}
      - if: steps.tiles.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends osmium-tool
          # osmium keeps the area's roads; the importer then reads them whole (several GB of the runner's 16 GB) and
          # the network is cut into tiles.
          just prepare

      - run: npm install --global @railway/cli@${{ env.RAILWAY_CLI_VERSION }}
      - run: just deploy

  # The documentation site goes to GitHub Pages (https://alandovskis.github.io/cityloom/) from a green main, like the
  # Railway deploy. Pages is set to deploy from GitHub Actions in the repository's settings.
  docs-deploy:
    name: Deploy the documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, docs]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
