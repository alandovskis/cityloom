name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request supersedes the run in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  JUST_VERSION: 1.58.0

# Actions are pinned to a commit; Dependabot proposes the updates.
jobs:
  format:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: npm ci
        working-directory: e2e
      - run: just format-check

  test:
    name: Unit tests
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cityloom
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      # Host tests, and a type-check of the code only the wasm32 target compiles.
      - run: just test
      # The issue system's labels, forms and labeler rules (standard library only, no setup).
      - run: just test-scripts

  server-release:
    name: Release server has no fake provider
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: just check-no-fake
      # A positive control: the check must fail on a build with the fake provider, or its markers have drifted.
      - run: |
          cargo build --release -p cityloom_server --features test-provider
          if ./scripts/check-no-fake.sh target/release/cityloom_server; then
            echo "check-no-fake.sh passed a build with the fake provider" >&2
            exit 1
          fi

  e2e:
    name: Browser tests
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cityloom
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            package-lock.json

      # wasm-bindgen-cli takes minutes to compile, so keep it for as long as its version holds.
      - id: wasm-bindgen
        run: echo "version=$(just --evaluate wasm_bindgen)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wasm-bindgen.outputs.version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - run: just setup
      - run: npx playwright install-deps chromium
        working-directory: e2e
      - run: just e2e
      - run: just e2e-archive

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The documentation site (website/) builds in both languages; a broken link fails the build.
  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: npm ci
        working-directory: website
      - run: just docs-build
      # What `docs-deploy` publishes; uploaded on every run, so a pull request shows the site would build.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  # Every pull request raises the version in Cargo.toml (semantic versioning); the pages show it in the menu.
  version:
    name: Version bump
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-version.sh "origin/$BASE_REF"

  # One check to require in branch protection, whatever jobs are added later.
  ci:
    name: CI
    if: always()
    needs: [format, test, e2e, docs, server-release, version]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*) exit 1 ;;
          esac

  # Only a green main goes live. Needs the RAILWAY_TOKEN secret (a project token for the cityloom project's
  # production environment) in the `production` environment.
  deploy:
    name: Deploy to Railway
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: production
    # Deploys run one at a time, in order, and are never cancelled half way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RAILWAY_CLI_VERSION: 5.64.2
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      # wasm-bindgen-cli and cargo-zigbuild take minutes to compile, so keep them (in a cache of their own, apart from the
      # browser tests') for as long as the wasm-bindgen version and the suffix below hold; the Railway CLI is pinned.
      - id: wasm-bindgen
        run: echo "version=$(just --evaluate wasm_bindgen)" >> "$GITHUB_OUTPUT"
      - id: deploy-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: deploy-tools-${{ runner.os }}-${{ steps.wasm-bindgen.outputs.version }}-zigbuild-1
      - if: steps.deploy-tools.outputs.cache-hit != 'true'
        run: |
          cargo install wasm-bindgen-cli --version ${{ steps.wasm-bindgen.outputs.version }} --root .tools
          cargo install cargo-zigbuild --locked --root .tools
      - run: npm ci

      # The tiles are made from Geofabrik's Quebec extract (1.2 GB) and take a long time, so keep them until the
      # code that makes them change. Run the workflow again after clearing the cache to take a newer extract.
      # The key hashes only the sources that decide the tiles and the basemap (cityloom_prepare's tiles, basemap and
      # metro_index modules): a change to the progress display, the archive or a dependency must not make them again.
      - id: tiles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/data/metro
            web/data/basemap/montreal.pmtiles
          key: tiles-${{ hashFiles('cityloom_prepare/src/tiles.rs', 'cityloom_prepare/src/basemap.rs', 'cityloom_prepare/src/metro_index.rs') }}
      - if: steps.tiles.outputs.cache-hit != 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.tiles.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends osmium-tool
          # osmium needs a gigabyte for each tile it cuts at once, and the runner has 16 GB.
          just prepare --batch 2

      - run: npm install --global @railway/cli@${{ env.RAILWAY_CLI_VERSION }}
      - run: just deploy

  # The documentation site goes to GitHub Pages (https://alandovskis.github.io/cityloom/) from a green main, like the
  # Railway deploy. Pages is set to deploy from GitHub Actions in the repository's settings.
  docs-deploy:
    name: Deploy the documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, docs]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
