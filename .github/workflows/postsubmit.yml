name: Postsubmit

# What main must pass once a pull request is merged, and what puts it live: every check in full (no spec is left out, as
# presubmit.yml may for a pull request), then the deploy. A manual run does the checks on the branch it is started on and
# never deploys.
#
# A change to documentation alone (the `docs` rule of scripts/ci/spec-map.json) does not start this workflow: it changes
# nothing the site serves, and .github/workflows/docs.yml builds, checks and publishes the documentation. No check is
# required on main, so a path filter is safe. scripts/include/tests/test_ci_changes.py fails when the list and that rule
# differ.
on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
  workflow_dispatch:

# Runs on main always finish; none is cancelled by a newer push.
concurrency:
  group: postsubmit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # Debug info is most of what the linker does for the test binaries, and no CI log shows it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  JUST_VERSION: 1.59.0

# Actions are pinned to a commit; Dependabot proposes the updates.
jobs:
  format:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: npm ci
        working-directory: tests/e2e
      - run: just format-check

  test:
    name: Unit tests
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cityloom
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: just test-host

  # A type-check of the code only the wasm32 target compiles, beside the host tests (`just test` runs both in turn).
  wasm:
    name: Wasm type-check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: just test-wasm

  # The issue system's labels, forms and labeler rules, and the CI selector's own tests (standard library only, no setup).
  scripts:
    name: Script tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: just test-scripts

  server-release:
    name: Release server has no fake provider
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: just check-no-fake
      # A positive control: the check must fail on a build with the fake provider, or its markers have drifted.
      - run: |
          cargo build --release -p cityloom_server --features test-provider
          if ./scripts/check-no-fake.sh target/release/cityloom_server; then
            echo "check-no-fake.sh passed a build with the fake provider" >&2
            exit 1
          fi

  # The wasm and the test-provider server are built once and handed to the three browser tiers, so splitting them does
  # not triple the build.
  build:
    name: Build for the browser tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      # wasm-bindgen-cli takes minutes to compile, so keep it for as long as its version holds.
      - id: wasm-bindgen
        run: echo "version=$(just --evaluate wasm_bindgen)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wasm-bindgen.outputs.version }}
      - run: npm ci
      - run: cargo install wasm-bindgen-cli --version ${{ steps.wasm-bindgen.outputs.version }} --root .tools
      - run: just build
      # The server the tiers start, copied to target/e2e (scripts/pin-server.sh).
      - run: just server
      # The OSM fixtures as network tiles (tests/e2e/fixtures/generated), which every tier serves or packs: made here, where
      # Rust and its cache already are, so the UI and integration jobs need no toolchain.
      - run: just e2e-fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-build
          path: |
            web/pkg
            web/vendor
            target/e2e/cityloom_server
            tests/e2e/fixtures/generated
          if-no-files-found: error
          retention-days: 1

  # UI tier (tests/e2e/tiers.json): one page, the network stubbed, the static server only. No database, no archive.
  # It is the longest job and main runs every spec, so it is split over runners: Playwright gives each shard a share of
  # the tests (fullyParallel).
  ui:
    name: UI tests (${{ matrix.shard }}/6)
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/browser-tests
      - run: npx playwright test --project=ui --shard=${{ matrix.shard }}/6
        working-directory: tests/e2e
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-ui-${{ matrix.shard }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Integration tier: the real server and a Postgres (sign-in, the account, the sync).
  integration:
    name: Integration tests
    needs: build
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cityloom
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/browser-tests
      - run: npx playwright test --project=integration
        working-directory: tests/e2e
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-integration
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # E2E tier: the whole path from data to page. The archive is packed from the fixtures (citymodel_builder, so this job has
  # Rust, and no database) and unpacked by a fresh server; the delivery specs read the real server's headers and ranges.
  e2e:
    name: E2E tests
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/browser-tests
      - run: scripts/e2e-archive.sh
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-e2e
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The deploy waits for this one job, whatever checks are added later.
  ci:
    name: All checks
    if: always()
    needs: [format, test, wasm, scripts, build, ui, integration, e2e, server-release]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: No job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac

  # Only a green main goes live. Needs the RAILWAY_TOKEN secret (a project token for the cityloom project's
  # production environment) in the `production` environment.
  deploy:
    name: Deploy to Railway
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: production
    # Deploys run one at a time, in order, and are never cancelled half way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RAILWAY_CLI_VERSION: 5.71.0
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      # wasm-bindgen-cli and cargo-zigbuild take minutes to compile, so keep them (in a cache of their own, apart from the
      # browser tests') for as long as the wasm-bindgen version and the suffix below hold; the Railway CLI is pinned.
      - id: wasm-bindgen
        run: echo "version=$(just --evaluate wasm_bindgen)" >> "$GITHUB_OUTPUT"
      - id: deploy-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: deploy-tools-${{ runner.os }}-${{ steps.wasm-bindgen.outputs.version }}-zigbuild-1
      - if: steps.deploy-tools.outputs.cache-hit != 'true'
        run: |
          cargo install wasm-bindgen-cli --version ${{ steps.wasm-bindgen.outputs.version }} --root .tools
          cargo install cargo-zigbuild --locked --root .tools
      - run: npm ci

      # The tiles are made from Geofabrik's Quebec extract (1.2 GB) and take a long time, so keep them until the
      # code that makes them change. Run the workflow again after clearing the cache to take a newer extract.
      # The key hashes only the sources that decide the tiles: citymodel_builder's tiles, metro_index and network_tiles
      # modules, and the importer that makes the network they are cut from (citymodel_builder's importer module, and
      # cityloom_model, which holds the network's shape and IMPORTER_VERSION, but not its street and catalogue modules,
      # the street as the editor keeps it, which the importer does not use), and cities/montreal.toml, which will hold
      # Montréal's grid (CLM-75) and changes nothing in the key until it exists. A change to any of them makes the tiles
      # again; a change to the progress display, the archive, the street model or a dependency does not.
      - id: tiles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/data/metro
          key: tiles-${{ hashFiles('crates/citymodel_builder/src/tiles.rs', 'crates/citymodel_builder/src/metro_index.rs', 'crates/citymodel_builder/src/network_tiles.rs', 'crates/citymodel_builder/src/importer/**', 'cities/montreal.toml', 'crates/cityloom_model/src/**', '!crates/cityloom_model/src/street/**', '!crates/cityloom_model/src/catalogue.rs') }}
      - if: steps.tiles.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends osmium-tool
          # osmium keeps the area's roads; the importer then reads them whole (several GB of the runner's 16 GB) and
          # the network is cut into tiles. Once the cities are config files, prepare takes one (CLM-75); before, it would
          # read the name as the extract's path. The else can go once CLM-75 has shipped.
          if [ -f cities/montreal.toml ]; then just prepare montreal; else just prepare; fi

      - run: npm install --global @railway/cli@${{ env.RAILWAY_CLI_VERSION }}
      - run: just deploy
