name: Browser test setup
description: >-
  What every browser tier needs and nothing the build needs: Playwright, and the wasm, the pinned test-provider server
  and the fixtures' network tiles that the `build` job made (web/pkg, web/vendor, target/e2e/cityloom_server,
  tests/e2e/fixtures/generated). The caller runs in the e2e image (dockerfiles/e2e.Dockerfile), which has Node and the
  Chromium the locked Playwright expects, and has checked the repository out.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: browser-build
    # An artifact keeps no file modes.
    - run: chmod +x target/e2e/cityloom_server
      shell: sh
    - run: npm ci
      shell: sh
      working-directory: tests/e2e
