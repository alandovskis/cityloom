# CityLoom's labels, synced on every push to main that changes this file (.github/workflows/labels.yml).
# A name is `<prefix>-<english> · <français>` and a description `<Family>: <sentence>. / <Famille> : <phrase>.`
# (a no-break space before the colon of the French half); .github/ISSUE_TEMPLATE and .github/issue-labeler.yml
# use these names, and scripts/include/tests/test_issue_system.py keeps them consistent.
# A- area of the product, C- kind of issue, O- browser or device (the reporter picks A- and O- on the form),
# P- priority and S- status (the maintainer sets them). `from_name` renames a label the repository already has.
# The last labels are left as they are: Dependabot applies four of them and GitHub's resolution labels are three.
# The sync deletes any label that is not listed here.
